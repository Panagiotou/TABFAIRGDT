[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabfairgdt"
version = "0.1.0"
description = "Fast Fair Tabular Data Generator using Autoregressive Decision Trees"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Emmanouil Panagiotou", email = "emmanouil.panagiotou@fu-berlin.de" },
    { name = "Benoît Ronval", email = "benoit.ronval@uclouvain.be" },
]
keywords = ["synthetic data", "fairness", "decision trees", "tabular data", "generative model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.7",
    "tqdm>=4.60",
    "joblib>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://arxiv.org/abs/2509.19927"
Repository = "https://github.com/emapanagiotou/tabfairgdt"

[tool.setuptools.packages.find]
where = ["."]
include = ["tabfairgdt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
